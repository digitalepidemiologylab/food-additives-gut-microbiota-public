[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "additives-microbiota"
version = "0.1.0"
description = "Food additive exposure and gut microbiota association analyses"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

